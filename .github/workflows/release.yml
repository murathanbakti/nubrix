name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: Nubrix
  XCODE_VERSION: "26.6"
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build without secrets
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a vX.Y.Z tag (Use workflow from → Tags), not from the branch '$GITHUB_REF_NAME'"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "Xcode ${XCODE_VERSION} not found, falling back to the newest Xcode 26.x"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::No Xcode 26 found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project "$PROJECT_NAME.xcodeproj"

      - name: Check tag against MARKETING_VERSION
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          build_settings="$(xcodebuild -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -configuration Release -showBuildSettings 2>/dev/null || true)"
          PROJECT_VERSION="$(awk '$1 == "MARKETING_VERSION" { print $3; exit }' <<< "$build_settings")"
          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $PROJECT_VERSION"
            exit 1
          fi
          BUILD_NUMBER="$(awk '$1 == "CURRENT_PROJECT_VERSION" { print $3; exit }' <<< "$build_settings")"
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CURRENT_PROJECT_VERSION '$BUILD_NUMBER' must be a positive integer (Sparkle compares it between releases)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: scripts/package-release.sh --build-only "$VERSION"
        env:
          NUBRIX_DERIVED_DATA: ${{ runner.temp }}/DerivedData-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nubrix-unsigned
          path: dist/Nubrix-${{ steps.version.outputs.version }}-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nubrix-dsyms
          path: dist/dSYMs-*.zip
          if-no-files-found: error

  release:
    name: Sign, notarize and draft release
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      version: ${{ needs.build.outputs.version }}
      signing_mode: ${{ steps.mode.outputs.signing_mode }}
      zip_sha256: ${{ steps.draft.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::No Xcode 26 found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nubrix-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Unpack the built app
        run: |
          app_dir="$RUNNER_TEMP/app"
          rm -rf "$app_dir"
          mkdir -p "$app_dir"
          ditto -x -k "$RUNNER_TEMP/unsigned/Nubrix-$VERSION-unsigned.zip" "$app_dir"
          if [[ -L "$app_dir/Nubrix.app" || ! -d "$app_dir/Nubrix.app" ]]; then
            echo "::error::The build artifact holds no Nubrix.app directory"
            exit 1
          fi
          scripts/verify-bundle.sh "$app_dir/Nubrix.app"
          echo "BUILT_APP=$app_dir/Nubrix.app" >> "$GITHUB_ENV"

      - name: Choose signing mode
        id: mode
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$DEVELOPER_ID_P12_BASE64" ]]; then
            present=()
            [[ -z "$DEVELOPER_ID_P12_PASSWORD" ]] || present+=("secret DEVELOPER_ID_P12_PASSWORD")
            [[ -z "$NOTARY_API_KEY_P8_BASE64" ]] || present+=("secret NOTARY_API_KEY_P8_BASE64")
            [[ -z "$NOTARY_API_KEY_ID" ]] || present+=("secret NOTARY_API_KEY_ID")
            [[ -z "$NOTARY_API_ISSUER_ID" ]] || present+=("secret NOTARY_API_ISSUER_ID")
            [[ -z "$APPLE_TEAM_ID" ]] || present+=("variable APPLE_TEAM_ID")
            if (( ${#present[@]} )); then
              echo "::error::DEVELOPER_ID_P12_BASE64 is empty but these are set: ${present[*]}. Add the .p12 for a Developer ID release, or remove them for an ad-hoc one"
              exit 1
            fi
            if [[ "$GITHUB_REPOSITORY" == "murathanbakti/nubrix" ]]; then
              echo "::error::The Developer ID secrets are missing in $GITHUB_REPOSITORY, refusing to build an ad-hoc release. Check the 'release' environment secrets"
              exit 1
            fi
            echo "::notice::No Developer ID secrets, building an ad-hoc signed release that is not notarized"
            echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
            echo "signing_mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ -n "$DEVELOPER_ID_P12_PASSWORD" ]] || missing+=("secret DEVELOPER_ID_P12_PASSWORD")
          [[ -n "$NOTARY_API_KEY_P8_BASE64" ]] || missing+=("secret NOTARY_API_KEY_P8_BASE64")
          [[ -n "$NOTARY_API_KEY_ID" ]] || missing+=("secret NOTARY_API_KEY_ID")
          [[ -n "$NOTARY_API_ISSUER_ID" ]] || missing+=("secret NOTARY_API_ISSUER_ID")
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || missing+=("variable APPLE_TEAM_ID (10 characters)")
          if (( ${#missing[@]} )); then
            echo "::error::DEVELOPER_ID_P12_BASE64 is set but these are missing: ${missing[*]}"
            exit 1
          fi
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Nubrix/Info.plist 2>/dev/null || true)"
          if [[ ! "$public_key" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::Nubrix/Info.plist has no valid SUPublicEDKey. Run scripts/setup-sparkle-key.sh and commit the result before tagging a Developer ID release"
            exit 1
          fi
          echo "SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate and notary key
        if: env.SIGNING_MODE == 'developer-id'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          umask 077
          secrets_dir="$RUNNER_TEMP/nubrix-signing"
          mkdir -p "$secrets_dir"
          keychain="$secrets_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$secrets_dir/developer-id.p12"
          security import "$secrets_dir/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -x
          rm -f "$secrets_dir/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          search=("$keychain")
          while IFS= read -r line; do
            line="${line//\"/}"
            line="${line#"${line%%[![:space:]]*}"}"
            [[ -n "$line" ]] && search+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search[@]}"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application: / && index($0, team) { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::The .p12 holds no valid Developer ID Application identity for team $APPLE_TEAM_ID"
            security find-identity -v -p codesigning "$keychain" | sed 's/^ *[0-9]*) [0-9A-F]* /  /'
            exit 1
          fi

          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$secrets_dir/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$secrets_dir/AuthKey.p8" || { echo "::error::NOTARY_API_KEY_P8_BASE64 does not decode to a .p8 key"; exit 1; }

          {
            echo "NUBRIX_SIGN_IDENTITY=$identity"
            echo "NUBRIX_SIGN_KEYCHAIN=$keychain"
            echo "NUBRIX_TEAM_ID=$APPLE_TEAM_ID"
            echo "NOTARY_KEY_PATH=$secrets_dir/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Sign, notarize and package
        run: scripts/package-release.sh --app "$BUILT_APP" "$VERSION"
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}

      - name: Remove signing keychain and notary key
        if: always()
        run: |
          secrets_dir="$RUNNER_TEMP/nubrix-signing"
          if [[ -f "$secrets_dir/signing.keychain-db" ]]; then
            security delete-keychain "$secrets_dir/signing.keychain-db" || true
          fi
          rm -rf "$secrets_dir"

      - name: Verify release zip
        run: |
          check="$RUNNER_TEMP/verify-zip"
          rm -rf "$check"
          mkdir -p "$check"
          ditto -x -k "dist/Nubrix-$VERSION.zip" "$check"
          app="$check/Nubrix.app"
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            export NUBRIX_REQUIRE_SPARKLE_KEY=1
          fi
          scripts/verify-bundle.sh "$app"
          details="$(codesign -dvv "$app" 2>&1)"
          grep -E '^(Authority|TeamIdentifier|Timestamp|Signature)=' <<< "$details" || true
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            xcrun stapler validate "$app"
            assessment="$(spctl --assess --type execute --verbose=2 "$app" 2>&1)"
            echo "$assessment"
            grep -q 'source=Notarized Developer ID' <<< "$assessment"
          else
            grep -q '^Signature=adhoc' <<< "$details"
          fi

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            signing_note="Signed with a Developer ID and notarized by Apple, so macOS opens it without a Gatekeeper prompt."
          else
            signing_note="Ad-hoc signed and not notarized. If you download the zip yourself, see [First launch](https://github.com/$GITHUB_REPOSITORY#first-launch-and-gatekeeper) in the README."
          fi
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$state" != "true" ]]; then
              echo "::error::A published release for $TAG already exists; refusing to modify it"
              exit 1
            fi
            gh release upload "$TAG" dist/Nubrix-*.zip dist/Nubrix-*.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/Nubrix-*.zip dist/Nubrix-*.zip.sha256 \
              --draft --verify-tag --title "Nubrix $VERSION" --notes "$signing_note" --generate-notes
          fi
          echo "zip_sha256=$(awk '{ print $1 }' "dist/Nubrix-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Nubrix $VERSION"
            echo
            echo "Draft release created for \`$TAG\`. Review and publish it, then copy the cask below into the tap."
            echo
            echo "Signing: \`$SIGNING_MODE\`"
            echo
            if [[ "$SIGNING_MODE" == "developer-id" ]]; then
              echo "The \`appcast\` job signs and attaches \`appcast.xml\` next; wait for it before publishing the draft."
              echo
            fi
            if [[ "$SIGNING_MODE" == "adhoc" ]]; then
              echo "> **Warning:** this build is not notarized and the cask keeps the quarantine flag, so do not publish it to the tap."
              echo
            fi
            echo "SHA-256:"
            echo '```'
            cat "dist/Nubrix-$VERSION.zip.sha256"
            echo '```'
            echo
            echo "Cask (\`Casks/nubrix.rb\`):"
            echo '```ruby'
            cat dist/nubrix.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nubrix-cask
          path: dist/nubrix.rb
          if-no-files-found: error

  appcast:
    name: Sign and attach the appcast
    needs: release
    if: needs.release.outputs.signing_mode == 'developer-id'
    runs-on: macos-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      EXPECTED_SHA256: ${{ needs.release.outputs.zip_sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the public key
        run: |
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Nubrix/Info.plist 2>/dev/null || true)"
          if [[ ! "$public_key" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::Nubrix/Info.plist has no valid SUPublicEDKey for tag $TAG. Run scripts/setup-sparkle-key.sh, commit the result and tag again"
            exit 1
          fi

      - name: Download the signed zip from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" \
            --pattern "Nubrix-$VERSION.zip" --pattern "Nubrix-$VERSION.zip.sha256"

      - name: Verify the zip against its SHA-256
        run: |
          cd "$RUNNER_TEMP/release"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::The release job reported no SHA-256"; exit 1; }
          asset_sha="$(awk '{ print $1 }' "Nubrix-$VERSION.zip.sha256")"
          actual_sha="$(shasum -a 256 "Nubrix-$VERSION.zip" | awk '{ print $1 }')"
          if [[ "$actual_sha" != "$asset_sha" || "$actual_sha" != "$EXPECTED_SHA256" ]]; then
            echo "::error::SHA-256 mismatch: zip $actual_sha, .sha256 asset $asset_sha, release job $EXPECTED_SHA256"
            exit 1
          fi
          echo "Nubrix-$VERSION.zip $actual_sha"

      - name: Fetch the pinned Sparkle tools
        run: scripts/sparkle-tools.sh "$RUNNER_TEMP/sparkle-tools"

      - name: Write the Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing in the release environment. Run scripts/setup-sparkle-key.sh"
            exit 1
          fi
          umask 077
          key_dir="$RUNNER_TEMP/sparkle-key"
          mkdir -p "$key_dir"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_dir/ed-key"
          echo "SPARKLE_ED_KEY_FILE=$key_dir/ed-key" >> "$GITHUB_ENV"

      - name: Generate the signed appcast
        run: |
          mkdir -p "$RUNNER_TEMP/appcast"
          scripts/make-appcast.sh --tools "$RUNNER_TEMP/sparkle-tools/bin" --tag "$TAG" \
            --zip "$RUNNER_TEMP/release/Nubrix-$VERSION.zip" --out "$RUNNER_TEMP/appcast/appcast.xml"

      - name: Remove the Sparkle signing key
        if: always()
        run: |
          key_dir="$RUNNER_TEMP/sparkle-key"
          if [[ -f "$key_dir/ed-key" ]]; then
            rm -P "$key_dir/ed-key" || true
          fi
          rm -rf "$key_dir"

      - name: Check the appcast
        run: |
          feed="$RUNNER_TEMP/appcast/appcast.xml"
          xmllint --noout "$feed"
          grep -q '<!-- sparkle-signatures:' "$feed"
          grep -q "releases/download/$TAG/Nubrix-$VERSION.zip" "$feed"
          echo "SPARKLE_VERSION=$(xmllint --xpath 'string(//*[local-name()="item"]/*[local-name()="version"])' "$feed")" >> "$GITHUB_ENV"

      - name: Attach the appcast to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$state" != "true" ]]; then
            echo "::error::The release for $TAG is already published; refusing to modify it"
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/appcast/appcast.xml" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx appcast.xml

      - name: Summary
        run: |
          {
            echo "## Appcast for Nubrix $VERSION"
            echo
            echo "\`appcast.xml\` (sparkle:version $SPARKLE_VERSION) is attached to the draft release for \`$TAG\`."
            echo "Sparkle sees it at \`releases/latest/download/appcast.xml\` once you publish the draft."
          } >> "$GITHUB_STEP_SUMMARY"
