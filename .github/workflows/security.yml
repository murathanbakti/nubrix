name: Security checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    # Mondays 06:00 UTC (09:00 Istanbul), so new zizmor audits also catch old workflows.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the PR if it adds or updates a dependency (Swift packages or
      # GitHub Actions) with a known vulnerability of moderate severity or worse.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Audits .github/ (workflows and dependabot.yml) for template injection,
      # over-broad permissions, credential persistence and unpinned actions.
      # Findings fail the job and print in the log; nothing is uploaded.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
