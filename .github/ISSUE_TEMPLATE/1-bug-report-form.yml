name: Bug Report
description: File a bug report.
title: '[Bug] '
type: Bug
labels:
  - unconfirmed
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. For security problems, do not open an issue; use the private report link on the issue chooser page or read SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? What are the steps to reproduce the issue?
      description: >-
        Describe the bug and include the steps to replicate the issue. Issues
        with screenshots or screen recordings will be resolved faster. Remove
        anything private from them first.
      placeholder: Clearly explain the issue. Please limit each post to one issue.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nubrix version
      description: >-
        Settings > About > Version, or the version in the release you downloaded.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Homebrew
        - Install script
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS version
      description: Apple menu > About This Mac
      placeholder: "macOS 15.5 Sequoia"
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model and display
      description: >-
        For example "MacBook Pro 14-inch 2023 (notch)", "MacBook Air 2020 plus an external monitor (no notch)".
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version (Claude-related bugs only)
      description: >-
        Output of `claude --version`. Also say whether you use the terminal, the desktop app or the VS Code extension.
      placeholder: "2.1.0 (terminal)"
    validations:
      required: false
  - type: dropdown
    id: music-source
    attributes:
      label: Music Source? (If relevant)
      description: >-
        If this issue is related to music, what music source did you select in
        Nubrix settings?
      options:
        - Now Playing
        - Apple Music
        - Spotify
        - YouTube Music
    validations:
      required: false
  - type: input
    id: music-app
    attributes:
      label: Music App (If using Now Playing)
    validations:
      required: false
  - type: input
    id: music-website
    attributes:
      label: Website (If using browser for music)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Please copy and paste any relevant log output. This will be
        automatically formatted into code, so no need for backticks. Remove
        tokens, paths and anything else private first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I haven't found any duplicates with my issue.
          required: true
        - label: I removed secrets and personal data from everything I pasted or attached.
          required: true
