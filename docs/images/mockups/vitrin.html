<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubrix Vitrin tab mockup</title>
<link rel="stylesheet" href="kit.css">
<style>
/* ---- Vitrin cards (VitrinCards.swift). 1pt = 1px. Accent = system blue, dark appearance. ---- */
:root { --accent: #0a84ff; --accent-18: rgba(10, 132, 255, .18); }
.vcard {
  position: relative; flex: none; overflow: hidden; border-radius: 10px;
  background: rgba(255, 255, 255, .06);
  transition: none;
}
.vcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); z-index: 5; }
.vcard.hover { background: rgba(255, 255, 255, .10); transform: scale(1.02); z-index: 3; }
.vcard.hover::after { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
.vcard.sel::after { box-shadow: inset 0 0 0 2px var(--accent); }
.vc-pinbtn {
  position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; z-index: 6;
  background: rgba(0, 0, 0, .6); color: #fff; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.vc-pindot {
  width: 14px; height: 14px; border-radius: 50%; background: #ff9f0a; color: #fff;
  display: flex; align-items: center; justify-content: center; flex: none;
}
.vc-foot { display: flex; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 500; line-height: 12px; color: rgba(255, 255, 255, .5); white-space: nowrap; }
.vc-foot .fi { width: 10px; height: 10px; display: flex; align-items: center; justify-content: center; }
.vc-foot .tn { font-variant-numeric: tabular-nums; }
.vc-foot .sp { flex: 1; min-width: 4px; }
.vc-img { position: absolute; inset: 0; background: rgba(0, 0, 0, .25); overflow: hidden; }
.vc-img .thumb { position: absolute; inset: 0; }
.vc-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 32px; background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .6)); }
.vc-ifoot { position: absolute; left: 8px; right: 8px; bottom: 6px; }
.vc-ifoot .vc-foot { color: rgba(255, 255, 255, .8); }
.vc-img .vc-pindot { position: absolute; top: 6px; left: 6px; }
.vc-text { height: 100%; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.vc-badges { display: flex; align-items: center; gap: 4px; height: 14px; flex: none; }
.vc-badge {
  height: 14px; padding: 0 6px; border-radius: 7px; background: var(--accent-18); color: var(--accent);
  font-size: 9px; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
}
.vc-badge i.dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .4); flex: none; }
.vc-code, .vc-plain {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; white-space: pre-wrap; text-align: left;
}
.vc-code, .vc-plain { flex: none; }
.vc-code { font-family: var(--mono); font-size: 10.5px; line-height: 12.6px; color: rgba(255, 255, 255, .9); }
.vc-plain { font-size: 11.5px; line-height: 14px; color: rgba(255, 255, 255, .9); word-break: break-all; }
.vc-grow { flex: 1; min-height: 0; }
.vc-swatch { height: 24px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); flex: none; }
.vc-colortext { font-family: var(--mono); font-size: 10.5px; line-height: 13px; color: rgba(255, 255, 255, .8); white-space: nowrap; overflow: hidden; }
.vc-linkic { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-18); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.vc-linkhead { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; flex: none; }
.vc-host { font-size: 12px; font-weight: 600; line-height: 14.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.vc-rest { font-size: 10.5px; line-height: 13px; color: rgba(255, 255, 255, .55); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-all; }
.vc-linkcol { display: flex; flex-direction: column; gap: 3px; flex: 1; min-height: 0; }
/* syntax colors (ClipHighlighter) */
.sx-c { color: rgb(115, 148, 120); } .sx-s { color: rgb(250, 158, 102); } .sx-n { color: rgb(133, 194, 255); } .sx-k { color: rgb(245, 120, 199); }
/* chip bar (VitrinChipBar) */
.vc-chips { display: flex; align-items: center; gap: 6px; padding: 0 6px; height: 20px; }
.vc-chip { height: 20px; padding: 0 9px; border-radius: 10px; background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .75); font-size: 10.5px; font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.vc-chip .n { font-weight: 400; opacity: .55; font-variant-numeric: tabular-nums; }
.vc-chip.sel { background: #fff; color: #000; }
/* scroller (VitrinCardScroller) */
.vc-row { display: flex; padding: 0 6px; overflow: hidden; position: relative; }
.vc-row.fade { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 16px), transparent); }


.vmenu { position: absolute; width: 184px; padding: 4px; border-radius: 10px; z-index: 30;
  background: rgba(40, 40, 43, .96); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2), 0 10px 28px rgba(0, 0, 0, .55); }
.vmenu .it { height: 22px; padding: 0 10px; border-radius: 5px; display: flex; align-items: center; font-size: 13px; color: rgba(255, 255, 255, .92); white-space: nowrap; }
.vmenu .it.hi { background: var(--accent); color: #fff; }
.vmenu .sep { height: 1px; margin: 5px 8px; background: rgba(255, 255, 255, .14); }
.vcursor { position: absolute; z-index: 40; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .5)); }
.vrow-wrap { margin-top: 8px; }

</style>
</head>
<body>
<!-- Open notch, Vitrin tab (VitrinTabView). 190pt notch, 100pt cards, 20pt chip bar. The notch is 836pt wide here (the app's is 640pt) so five cards fit. -->
<div class="scene" data-size="1400x500" style="--W:1400px;--H:500px;--s:1.674641">
  <div class="desk"></div>
  <div class="stage">
    <div class="notch open" style="--nw:836px;--nh:190px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab sel"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
              <div class="tab"><i data-icon="terminal" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Mon 2</div>
            <div class="round-btn"><i data-icon="camera" data-size="16"></i></div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct">
              <span class="pct">71%</span>
              <div class="battery">
                <svg width="31" height="15" viewBox="0 0 31 15">
                  <rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/>
                  <path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/>
                  <rect x="2" y="2.9" width="17.6" height="9.25" rx="2.5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div class="nx-content" style="height:138px">
          <div class="vc-chips" id="chips"></div>
          <div class="vc-row fade" id="row" style="margin-top:8px;height:106px;padding:3px 6px;gap:10px"></div>
        </div>
      </div>
    </div>
    <div class="vmenu" style="left:262px;top:152px">
      <div class="it">Copy</div>
      <div class="it">Unpin</div>
      <div class="sep"></div>
      <div class="it hi">Copy pretty JSON</div>
      <div class="it">Copy minified JSON</div>
      <div class="sep"></div>
      <div class="it">Delete</div>
    </div>
    <svg class="vcursor" style="left:258px;top:148px" width="13" height="19" viewBox="0 0 13 19"><path d="M1.2 1v14.2l3.6-3.4 2.6 5.6 2.2-1-2.6-5.5h5L1.2 1z" fill="#000" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>
  </div>
</div>

<script src="icons.js"></script>
<script>
/* ---- Vitrin mock lib: hand-drawn icons, CSS thumbnails, highlighter, card builders ---- */
var VS = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
var VICONS = {
  photo: '<rect x="3" y="4.5" width="18" height="15" rx="3" ' + VS + ' stroke-width="2"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="M4 17.2l5-4.6 3.4 3 3-2.6 5.2 4.2" ' + VS + ' stroke-width="2"/>',
  viewfinder: '<path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16" ' + VS + ' stroke-width="2"/><rect x="8" y="9.4" width="8" height="6" rx="1.6" ' + VS + ' stroke-width="1.8"/><circle cx="12" cy="12.4" r="1.3" fill="currentColor"/>',
  textLeft: '<path d="M4 6h16M4 10.7h10.5M4 15.4h16M4 20h10.5" ' + VS + ' stroke-width="2.1"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" ' + VS + ' stroke-width="2.3"/>',
  pin: '<path d="M12 16.5V22M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
  pinSlash: '<path d="M12 16.5V22M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M3.5 3.5l17 17" stroke="#000" stroke-width="4.4" stroke-linecap="round"/><path d="M3.5 3.5l17 17" ' + VS + ' stroke-width="2.2"/>'
};
function vi(name, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">' + VICONS[name] + '</svg>';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ClipHighlighter grammars (subset used here). Groups: comment, string, number, keyword. */
var QUOTES = '"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'';
function words(l) { return '\\b(?:' + l.split(' ').join('|') + ')\\b'; }
var GRAMMAR = {
  JSON: { c: '(?!)', s: '"(?:\\\\.|[^"\\\\\\n])*"', n: '-?\\b\\d+(?:\\.\\d+)?(?:[eE][+\\-]?\\d+)?\\b', k: words('true false null') },
  Swift: { c: '//[^\\n]*|/\\*[\\s\\S]*?\\*/', s: '"(?:\\\\.|[^"\\\\\\n])*"', n: '\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?)\\b',
    k: words('func let var if else guard return struct class enum extension protocol import in for while switch case default break continue self Self init nil true false try catch throw throws async await some any static private public') + '|@\\w+' },
  Shell: { c: '#[^\\n]*', s: QUOTES, n: '\\b(?:0[xX][0-9a-fA-F]+|\\d+(?:\\.\\d+)?)\\b',
    k: words('if then else elif fi for while do done case esac function in return export local source alias unset set echo cd sudo exit') + '|\\$\\{?\\w+\\}?' }
};
function hl(text, lang) {
  var g = GRAMMAR[lang];
  if (!g) return esc(text);
  var re = new RegExp('(' + g.c + ')|(' + g.s + ')|(' + g.n + ')|(' + g.k + ')', 'gm');
  var out = '', cur = 0, m, cls = ['sx-c', 'sx-s', 'sx-n', 'sx-k'];
  while ((m = re.exec(text))) {
    if (!m[0].length) { re.lastIndex++; continue; }
    out += esc(text.slice(cur, m.index));
    var k = 1; while (!m[k]) k++;
    out += '<span class="' + cls[k - 1] + '">' + esc(m[0]) + '</span>';
    cur = m.index + m[0].length;
  }
  return out + esc(text.slice(cur));
}

/* ---- CSS thumbnails (dummy screenshots / images). Layout is percentage based so it fits any card size. ---- */
function bar(l, t, w, h, bg, extra) { return '<i style="position:absolute;left:' + l + '%;top:' + t + '%;width:' + w + '%;height:' + h + '%;background:' + bg + ';border-radius:' + (extra || 1.5) + 'px"></i>'; }
function windowShell(bg, titleBg, inner, wallpaper) {
  return '<div class="thumb" style="background:' + (wallpaper || 'linear-gradient(135deg,#5a67ff,#b863ff 60%,#ff8f6b)') + '">' +
    '<div style="position:absolute;left:8%;top:11%;right:8%;bottom:-6%;border-radius:5px 5px 0 0;background:' + bg + ';box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.18);overflow:hidden">' +
    '<div style="position:absolute;left:0;right:0;top:0;height:13%;background:' + titleBg + '">' +
    '<i style="position:absolute;left:4%;top:34%;width:4px;height:4px;border-radius:50%;background:#ff5f57"></i>' +
    '<i style="position:absolute;left:4%;margin-left:7px;top:34%;width:4px;height:4px;border-radius:50%;background:#febc2e"></i>' +
    '<i style="position:absolute;left:4%;margin-left:14px;top:34%;width:4px;height:4px;border-radius:50%;background:#28c840"></i></div>' +
    inner + '</div></div>';
}
var THUMB = {
  editor: function () {
    var side = bar(0, 13, 26, 100, '#1b1d2b') + bar(5, 22, 14, 4, '#5b6180') + bar(9, 32, 12, 4, '#4a506e') + bar(9, 42, 15, 4, '#7a6bff') + bar(9, 52, 10, 4, '#4a506e') + bar(5, 64, 13, 4, '#5b6180') + bar(9, 74, 11, 4, '#4a506e');
    var main = bar(32, 24, 22, 4, '#f578c7') + bar(56, 24, 20, 4, '#85c2ff') + bar(32, 34, 12, 4, '#fa9e66') + bar(46, 34, 28, 4, '#c9cde6') +
      bar(38, 44, 30, 4, '#c9cde6') + bar(38, 54, 18, 4, '#73947a') + bar(58, 54, 16, 4, '#fa9e66') + bar(32, 64, 10, 4, '#f578c7') + bar(44, 64, 32, 4, '#c9cde6') + bar(32, 74, 6, 4, '#85c2ff');
    return windowShell('#232536', '#2d3045', side + main);
  },
  dash: function () {
    var tiles = bar(5, 22, 28, 22, '#e7ebff', 2) + bar(36, 22, 28, 22, '#e7ebff', 2) + bar(67, 22, 28, 22, '#e7ebff', 2);
    var chart = bar(8, 80, 6, 14, '#7c5cff') + bar(18, 70, 6, 24, '#7c5cff') + bar(28, 74, 6, 20, '#7c5cff') + bar(38, 60, 6, 34, '#7c5cff') + bar(48, 66, 6, 28, '#7c5cff') + bar(58, 52, 6, 42, '#7c5cff') + bar(68, 62, 6, 32, '#7c5cff') + bar(78, 56, 6, 38, '#7c5cff') + bar(88, 66, 6, 28, '#b9a8ff');
    var heads = bar(7, 28, 12, 4, '#9aa3d4') + bar(38, 28, 12, 4, '#9aa3d4') + bar(69, 28, 12, 4, '#9aa3d4') + bar(7, 36, 16, 5, '#2a3166') + bar(38, 36, 14, 5, '#2a3166') + bar(69, 36, 18, 5, '#2a3166') + bar(5, 50, 40, 4, '#c3c9ec');
    return windowShell('#f6f7fd', '#e4e7f6', tiles + heads + chart, 'linear-gradient(135deg,#1fb5a8,#4b7bff 60%,#7c5cff)');
  },
  term: function () {
    var t = bar(5, 24, 30, 4, '#32d74b') + bar(37, 24, 36, 4, '#e6e6e6') + bar(5, 34, 52, 4, '#98989d') + bar(5, 44, 44, 4, '#98989d') + bar(5, 54, 58, 4, '#98989d') +
      bar(5, 64, 24, 4, '#32d74b') + bar(31, 64, 20, 4, '#e6e6e6') + bar(5, 74, 3, 5, '#e6e6e6');
    return windowShell('#12131a', '#242632', t, 'linear-gradient(135deg,#2a3b8f,#2b6fb3 55%,#27b3a4)');
  },
  imgA: function () { return '<div class="thumb" style="background:radial-gradient(60% 75% at 18% 22%,#ff9a62 0%,rgba(255,154,98,0) 70%),radial-gradient(70% 85% at 88% 18%,#7c5cff 0%,rgba(124,92,255,0) 72%),radial-gradient(85% 75% at 52% 105%,#22c7b8 0%,rgba(34,199,184,0) 72%),#1f2452"></div>'; },
  imgB: function () { return '<div class="thumb" style="background:radial-gradient(circle at 68% 34%,rgba(255,255,255,.55) 0 7%,rgba(255,255,255,0) 8%),radial-gradient(70% 90% at 82% 85%,#ff5fa2 0%,rgba(255,95,162,0) 68%),radial-gradient(65% 75% at 12% 28%,#4a7dff 0%,rgba(74,125,255,0) 72%),#171641"></div>'; },
  imgC: function () { return '<div class="thumb" style="background:radial-gradient(70% 60% at 25% 100%,#fde68a 0%,rgba(253,230,138,0) 70%),radial-gradient(80% 90% at 85% 15%,#22d3a6 0%,rgba(34,211,166,0) 70%),linear-gradient(160deg,#0b4f63,#0f766e)"></div>'; }
};

/* ---- card builders ---- */
function foot(glyph, age, detail) {
  return '<div class="vc-foot"><span class="fi">' + vi(glyph, 10) + '</span><span>' + age + '</span>' +
    (detail ? '<span class="sp"></span><span class="tn">' + detail + '</span>' : '') + '</div>';
}
function pinDot() { return '<span class="vc-pindot">' + vi('pin', 7) + '</span>'; }
function badge(label, dot) { return '<span class="vc-badge">' + (dot ? '<i class="dot" style="background:' + dot + '"></i>' : '') + label + '</span>'; }
function cardShell(it, w, h, inner) {
  var cls = 'vcard' + (it.hover ? ' hover' : '') + (it.sel ? ' sel' : '');
  var pb = it.hover ? '<span class="vc-pinbtn">' + vi(it.pinned ? 'pinSlash' : 'pin', 9) + '</span>' : '';
  return '<div class="' + cls + '" style="width:' + w + 'px;height:' + h + 'px">' + inner + pb + '</div>';
}
function card(it, w, h) {
  var inner = '';
  if (it.type === 'image') {
    inner = '<div class="vc-img">' + THUMB[it.thumb]() + '<div class="vc-shade"></div>' +
      (it.pinned ? pinDot() : '') +
      '<div class="vc-ifoot">' + foot(it.shot ? 'viewfinder' : 'photo', it.age, it.hover ? it.dims : '') + '</div></div>';
  } else if (it.type === 'link') {
    inner = '<div class="vc-text"><div class="vc-linkhead">' + (it.pinned ? pinDot() : '') + '<span class="vc-linkic">' + vi('link', 10) + '</span></div>' +
      '<div class="vc-linkcol"><div class="vc-host">' + it.host + '</div>' + (it.rest ? '<div class="vc-rest">' + it.rest + '</div>' : '') + '</div>' +
      foot('link', it.age) + '</div>';
  } else {
    var badges = (it.pinned || it.badge) ? '<div class="vc-badges">' + (it.pinned ? pinDot() : '') + (it.badge ? badge(it.badge, it.dot) : '') + '</div>' : '';
    var body;
    if (it.color) {
      body = '<div class="vc-swatch" style="background:' + it.color + '"></div><div class="vc-colortext">' + it.text + '</div>';
    } else if (it.lang) {
      body = '<div class="vc-code">' + hl(it.text, it.lang) + '</div>';
    } else {
      body = '<div class="vc-plain">' + esc(it.text) + '</div>';
    }
    inner = '<div class="vc-text">' + badges + body + '<div class="vc-grow"></div>' + foot('textLeft', it.age) + '</div>';
  }
  return cardShell(it, w, h, inner);
}

var JSON_TEXT = '{\n  "order": 4821,\n  "org": "acme",\n  "status": "paid",\n  "total": 208.5\n}';
var SWIFT_TEXT = '@State var count = 0\nlet limit = 120\nguard count < limit\nelse { return }';
var items = [
  { type: 'image', thumb: 'editor', shot: true, age: 'now' },
  { type: 'text', badge: 'JSON', lang: 'JSON', text: JSON_TEXT, pinned: true, hover: true, age: '4m' },
  { type: 'link', host: 'docs.acme.dev', rest: '/api/rate-limits', age: '12m' },
  { type: 'text', badge: 'Swift', lang: 'Swift', text: SWIFT_TEXT, age: '38m' },
  { type: 'text', badge: '#7C5CFF', dot: '#7C5CFF', color: '#7C5CFF', text: '#7C5CFF', age: '2h' }
];
document.getElementById('row').innerHTML = items.map(function (it) { return card(it, 145, 100); }).join('');
var chips = [['All', 0, 1], ['Images', 4], ['Screenshots', 2], ['Text', 9], ['Links', 3]];
document.getElementById('chips').innerHTML = chips.map(function (c) {
  return '<span class="vc-chip' + (c[2] ? ' sel' : '') + '">' + c[0] + (c[1] ? '<span class="n">' + c[1] + '</span>' : '') + '</span>';
}).join('');
</script>
</body>
</html>
