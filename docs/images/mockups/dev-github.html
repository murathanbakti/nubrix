<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubrix Dev tab, GitHub mockup</title>
<link rel="stylesheet" href="kit.css">
<style>
  .dev-tab { padding-top: 4px; display: flex; flex-direction: column; gap: 6px; }
  .dev-seg { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
  .dev-seg .s { font-size: 11px; font-weight: 600; line-height: 13px; padding: 3px 10px; border-radius: 10px; color: var(--gray); white-space: nowrap; }
  .dev-seg .s.sel { color: #fff; background: rgba(255, 255, 255, .14); }
  .dev-seg .sp { flex: 1; }
  .dev-seg .login { font-size: 10px; line-height: 12px; color: rgb(115, 115, 115); }
  .dev-seg .refresh { color: var(--gray); }
  .dev-cols { display: flex; align-items: flex-start; gap: 8px; }
  .dev-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dev-col .h { display: flex; align-items: center; gap: 4px; padding: 0 2px; font-size: 10px; line-height: 12px; }
  .dev-col .h .t { font-weight: 600; color: var(--gray); }
  .dev-col .h .n { font-weight: 500; color: rgb(115, 115, 115); font-variant-numeric: tabular-nums; }
  .dev-list { display: flex; flex-direction: column; gap: 3px; }
  .dev-row {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px;
    background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .08);
  }
  .dev-row .g { width: 12px; height: 12px; flex: none; display: flex; }
  .dev-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .dev-row .ti { font-size: 11px; line-height: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-row .su { font-size: 10px; line-height: 12px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-row .tr { display: flex; align-items: center; gap: 3px; flex: none; }
  .dev-badge { font-size: 9px; line-height: 11px; font-weight: 700; padding: 1px 4px; border-radius: 8px; white-space: nowrap; }
  .dev-badge.gray { color: var(--gray); background: rgba(152, 152, 157, .18); }
  .dev-badge.green { color: var(--green); background: rgba(50, 215, 75, .18); }
  .dev-badge.orange { color: var(--orange); background: rgba(255, 159, 10, .18); }
</style>
</head>
<body>
<div class="scene" data-size="1500x600" style="--W:1500px;--H:600px;--s:2">
  <div class="desk"></div>
  <div class="stage">
    <div class="notch open" style="--nw:640px;--nh:272px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
              <div class="tab sel"><i data-icon="terminal" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Mon 2</div>
            <div class="round-btn"><i data-icon="camera" data-size="16"></i></div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct">
              <span class="pct">64%</span>
              <div class="battery">
                <svg width="31" height="15" viewBox="0 0 31 15">
                  <rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/>
                  <path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/>
                  <rect x="2" y="2.9" width="15.4" height="9.25" rx="2.5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="nx-content" style="height:auto">
          <div class="dev-tab">
            <div class="dev-seg">
              <span class="s sel">GitHub</span><span class="s">Servers</span><span class="s">Notifications</span>
              <span class="sp"></span>
              <span class="login">@acme-dev</span>
              <span class="refresh">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 3.5v5h-5"/></svg>
              </span>
            </div>
            <div class="dev-cols" id="cols"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script>
  var uid = 0;
  function checkGlyph(state) {
    if (state === 'success') return '<span style="color:var(--green);display:flex">' + Nubrix.icon('checkCircle', 12) + '</span>';
    if (state === 'failure') return '<span style="color:var(--red);display:flex">' + Nubrix.icon('xCircle', 12) + '</span>';
    if (state === 'pending') return '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="3.6" fill="var(--orange)"/></svg>';
    return '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="var(--gray)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.1 3.1"/></svg>';
  }
  function runGlyph(state) {
    if (state === 'running') return '<span style="color:var(--orange);display:flex">' + Nubrix.spinner(12, 30) + '</span>';
    if (state === 'cancelled') {
      var id = 'sl' + (++uid);
      return '<svg width="12" height="12" viewBox="0 0 24 24"><mask id="' + id + '"><rect width="24" height="24" fill="#fff"/><path d="M8 16 16 8" stroke="#000" stroke-width="2.4" stroke-linecap="round"/></mask><circle cx="12" cy="12" r="10.2" fill="var(--gray)" mask="url(#' + id + ')"/></svg>';
    }
    return checkGlyph(state);
  }
  var WARN = '<span style="color:var(--orange);display:flex">' + Nubrix.icon('warn', 10) + '</span>';

  var reviews = [
    { t: 'Add saved carts', r: 'web-app', n: 131, a: '12m', c: 'pending' },
    { t: 'Paginate audit log', r: 'api-server', n: 482, a: '1h', c: 'success' },
    { t: 'Fix cart text clipping', r: 'mobile-ios', n: 207, a: '3h', c: 'success' },
    { t: 'Token bucket limiter', r: 'api-server', n: 479, a: '5h', c: 'failure' },
    { t: 'Server-side checkout', r: 'web-app', n: 127, a: '1d', c: 'none' }
  ];
  var mine = [
    { t: 'Cart summary redesign', r: 'web-app', n: 128, a: '25m', c: 'success', rv: 'approved' },
    { t: 'Fix limiter bursts', r: 'api-server', n: 476, a: '2h', c: 'failure', rv: 'changes' },
    { t: 'Release notes 2.4', r: 'mobile-ios', n: 211, a: '4h', c: 'success', conflict: true },
    { t: 'Cache catalog queries', r: 'api-server', n: 481, a: '6h', c: 'pending' },
    { t: 'Offline order queue', r: 'mobile-ios', n: 209, a: '2d', c: 'none', draft: true }
  ];
  var runs = [
    { n: 'CI', r: 'web-app', b: 'feat/carts', a: 'now', s: 'running' },
    { n: 'Release', r: 'mobile-ios', b: 'release/2.4', a: '14m', s: 'success' },
    { n: 'Lint', r: 'api-server', b: 'fix/limiter', a: '22m', s: 'failure' },
    { n: 'CI', r: 'api-server', b: 'main', a: '1h', s: 'success' },
    { n: 'CI', r: 'mobile-ios', b: 'feat/offline', a: '5h', s: 'cancelled' }
  ];

  function prRow(p) {
    var tr = '';
    if (p.draft) tr += '<span class="dev-badge gray">draft</span>';
    if (p.rv === 'approved') tr += '<span class="dev-badge green">✓</span>';
    if (p.rv === 'changes') tr += '<span class="dev-badge orange">Δ</span>';
    if (p.conflict) tr += WARN;
    return '<div class="dev-row"><span class="g">' + checkGlyph(p.c) + '</span><div class="tx"><div class="ti">' + p.t +
      '</div><div class="su">' + p.r + ' #' + p.n + ' · ' + p.a + '</div></div><div class="tr">' + tr + '</div></div>';
  }
  function runRow(r) {
    return '<div class="dev-row"><span class="g">' + runGlyph(r.s) + '</span><div class="tx"><div class="ti">' + r.n +
      '</div><div class="su">' + r.r + ' · ' + r.b + ' · ' + r.a + '</div></div></div>';
  }
  function col(title, rows) {
    return '<div class="dev-col"><div class="h"><span class="t">' + title + '</span><span class="n">' + rows.length +
      '</span></div><div class="dev-list">' + rows.join('') + '</div></div>';
  }
  document.getElementById('cols').innerHTML =
    col('Review requested', reviews.map(prRow)) + col('My PRs', mine.map(prRow)) + col('Actions', runs.map(runRow));
</script>
</body>
</html>
