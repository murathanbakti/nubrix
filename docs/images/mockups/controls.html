<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubrix Controls tab mockup</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* Controls tab, v3. Open notch 640 x 270 on this tab; content 578 x 218.
     No boxed cards: two columns split by a hairline. Control Center style. */
  :root { --accent: #0a84ff; }
  .ctl { display: flex; height: 218px; padding-top: 2px; }
  .col-l { width: 262px; display: flex; flex-direction: column; gap: 12px; padding: 4px 18px 0 2px; }
  .vline { width: 1px; background: rgba(255,255,255,.08); margin: 6px 0 10px; flex: none; }
  .col-r { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 2px 0 0 16px; }

  .grp { display: flex; flex-direction: column; gap: 6px; }
  .glabel { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.55); letter-spacing: .1px; }

  /* Capsule slider, 28 high, icon inside on the left, value on the right. */
  .cap { position: relative; height: 28px; border-radius: 14px; background: rgba(255,255,255,.10); overflow: hidden; }
  .cap > i { position: absolute; left: 0; top: 0; bottom: 0; min-width: 28px; background: rgba(255,255,255,.92); border-radius: 14px; }
  .cap .ico { position: absolute; left: 9px; top: 0; bottom: 0; display: flex; align-items: center; color: #1c1c1e; }
  .cap .ico.lt { color: rgba(255,255,255,.8); }
  .cap .val { position: absolute; right: 11px; top: 0; bottom: 0; display: flex; align-items: center; font-family: var(--rounded); font-size: 11px; font-weight: 600; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
  .cap .val.on { color: #1c1c1e; }

  /* Segmented control: quiet, no box. */
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(255,255,255,.06); align-self: flex-start; }
  .seg span { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5); padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
  .seg span.sel { color: #fff; background: rgba(255,255,255,.14); }

  .list { display: flex; flex-direction: column; gap: 1px; }
  .row { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 4px; border-radius: 10px; }
  .row.hover { background: rgba(255,255,255,.06); }
  .bub { width: 28px; height: 28px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.10); color: rgba(255,255,255,.85); }
  .bub.on { background: var(--accent); color: #fff; }
  .row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row .n { font-size: 12.5px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 15px; }
  .row .s { font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,.5); line-height: 13px; white-space: nowrap; }
  .bat { display: flex; align-items: center; gap: 8px; flex: none; }
  .bat span { display: flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
  .bat em { font-style: normal; color: rgba(255,255,255,.4); font-weight: 600; }
  .hint { font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.6); flex: none; }
  .tog { width: 34px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; flex: none; }
  .tog b { position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; }
  .bars i { width: 3px; border-radius: 1px; background: rgba(255,255,255,.8); }
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
  .bars i.dim { background: rgba(255,255,255,.2); }
  .sub { font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.45); padding: 4px 4px 2px; }
  .qrow { display: flex; justify-content: space-between; padding: 0 2px; }
  .q { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .q span { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.6); white-space: nowrap; }
  .qb { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.12); color: #fff; }
  .qb.on { background: var(--accent); }
  .q.sel .qb { background: rgba(255,59,48,.9); }
  .share { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: 10px; background: rgba(255,159,10,.14); box-shadow: inset 0 0 0 1px rgba(255,159,10,.35); margin-top: -4px; }
  .share .dot { width: 7px; height: 7px; border-radius: 4px; background: #ff9f0a; flex: none; }
  .share .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .share .t1 { font-size: 11px; font-weight: 600; color: #ffb340; line-height: 13px; }
  .share .t2 { font-size: 9.5px; font-weight: 500; color: rgba(255,255,255,.55); line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .share .sbtn { font-size: 10px; font-weight: 600; color: #fff; padding: 3px 9px; border-radius: 9px; background: rgba(255,255,255,.14); flex: none; }
  .foot { margin-top: auto; padding: 0 4px 2px; font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,.45); display: flex; justify-content: space-between; }

  .ref { position: absolute; top: 300px; left: 50%; width: 312px; margin-left: 4px; padding: 10px 14px; border-radius: 18px; background: #000; }
  .ref .cap-t { font-size: 10px; color: rgba(255,255,255,.4); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="scene" data-size="1600x560" style="--W:1600px;--H:560px;--s:1.8">
  <div class="desk"></div>
  <div class="stage">
    <div class="menubar">
      <div class="left"><span style="background:rgba(255,255,255,.9);width:14px;height:14px;border-radius:4px;display:block"></span><span class="app">Finder</span></div>
      <div class="right"><span>Sun&nbsp;&nbsp;09:41</span></div>
    </div>

    <div class="notch open" style="--nw:640px;--nh:270px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab sel">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
              </div>
              <div class="tab"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Sun 8</div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct"><span class="pct">87%</span>
              <div class="battery"><svg width="31" height="15" viewBox="0 0 31 15"><rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/><path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/><rect x="2" y="2.9" width="21" height="9.25" rx="2.5" fill="#32d74b"/></svg></div>
            </div>
          </div>
        </div>

        <div class="nx-content" style="height:218px">
          <div class="ctl">
            <!-- Left: quick toggles and levels -->
            <div class="col-l" style="gap:12px">
              <div class="qrow">
                <div class="q"><div class="qb on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg></div><span>Wi‑Fi</span></div>
                <div class="q"><div class="qb on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></div><span>Bluetooth</span></div>
                <div class="q"><div class="qb"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><span>Sound</span></div>
                <div class="q sel"><div class="qb"><svg width="15" height="18" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="2" width="8" height="13" rx="4" fill="currentColor"/><path d="M2 11a8 8 0 0 0 16 0M10 19v3M1 1l18 22"/></svg></div><span>Mic off</span></div>
                <div class="q"><div class="qb on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="3" width="15" height="11" rx="2"/><rect x="8" y="9" width="14" height="11" rx="2" fill="currentColor" fill-opacity=".35"/></svg></div><span>Mirroring</span></div>
              </div>
              <div class="grp" style="gap:6px">
                <div class="cap"><i style="width:72%"></i>
                  <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
                  <span class="val">72%</span></div>
                <div class="cap"><i style="width:66%"></i>
                  <span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
                  <span class="val">66%</span></div>
                <div class="cap"><i style="width:30%"></i>
                  <span class="ico"><svg width="16" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="10" width="20" height="10" rx="2"/><path d="M6 14h.01M10 14h.01M14 14h.01M18 14h.01M12 3v3M7 5l1.5 2M17 5l-1.5 2" stroke-linecap="round"/></svg></span>
                  <span class="val">30%</span></div>
              </div>
              <div class="share"><span class="dot"></span><div class="mid"><span class="t1">Screen is being shared</span><span class="t2">Mirroring to Living Room TV</span></div><span class="sbtn">Hide notch</span></div>
            </div>

            <div class="vline"></div>

            <!-- Right: devices -->
            <div class="col-r">
              <div class="seg"><span class="sel">Wi‑Fi</span><span>Bluetooth</span><span>Output</span><span>Input</span><span>Drives</span></div>
              <div class="list">
                                <div class="row">
                  <div class="bub on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg></div>
                  <div class="mid"><span class="n">Home 5G</span><span class="s">Connected · 192.168.1.24</span></div>
                  <span class="bars"><i></i><i></i><i></i><i class="dim"></i></span>
                </div>
                <div class="sub">Other networks</div>
                <div class="row hover">
                  <div class="bub"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg></div>
                  <div class="mid"><span class="n">Office</span><span class="s">Secured</span></div>
                  <span class="hint">Join</span>
                  <span class="bars"><i></i><i></i><i class="dim"></i><i class="dim"></i></span>
                </div>
                <div class="row">
                  <div class="bub"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.3" fill="currentColor" stroke="none"/></svg></div>
                  <div class="mid"><span class="n">Cafe Guest</span><span class="s">Open</span></div>
                  <span class="bars"><i></i><i class="dim"></i><i class="dim"></i><i class="dim"></i></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    </div>
</div>
<script src="icons.js"></script>
</body>
</html>
