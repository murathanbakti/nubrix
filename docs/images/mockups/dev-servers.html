<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubrix Dev tab, Servers mockup</title>
<link rel="stylesheet" href="kit.css">
<style>
  .dev-tab { padding-top: 4px; display: flex; flex-direction: column; gap: 6px; }
  .dev-seg { display: flex; align-items: center; gap: 4px; padding: 0 2px; }
  .dev-seg .s { font-size: 11px; font-weight: 600; line-height: 13px; padding: 3px 10px; border-radius: 10px; color: var(--gray); white-space: nowrap; }
  .dev-seg .s.sel { color: #fff; background: rgba(255, 255, 255, .14); }
  .dev-seg .sp { flex: 1; }
  .dev-seg .login { font-size: 10px; line-height: 12px; color: rgb(115, 115, 115); }
  .dev-seg .refresh { color: var(--gray); }
  .dev-cols { display: flex; align-items: flex-start; gap: 8px; }
  .dev-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dev-col .h { display: flex; align-items: center; gap: 4px; padding: 0 2px; font-size: 10px; line-height: 12px; }
  .dev-col .h .t { font-weight: 600; color: var(--gray); }
  .dev-col .h .n { font-weight: 500; color: rgb(115, 115, 115); font-variant-numeric: tabular-nums; }
  .dev-list { display: flex; flex-direction: column; gap: 3px; }
  .dev-row {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px;
    background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .08);
  }
  .dev-row .g { width: 12px; height: 12px; flex: none; display: flex; }
  .dev-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .dev-row .ti { font-size: 11px; line-height: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-row .su { font-size: 10px; line-height: 12px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-row .tr { display: flex; align-items: center; gap: 3px; flex: none; }
  .dev-badge { font-size: 9px; line-height: 11px; font-weight: 700; padding: 1px 4px; border-radius: 8px; white-space: nowrap; }
  .dev-badge.gray { color: var(--gray); background: rgba(152, 152, 157, .18); }
  .dev-badge.green { color: var(--green); background: rgba(50, 215, 75, .18); }
  .dev-badge.orange { color: var(--orange); background: rgba(255, 159, 10, .18); }
  .dev-sub { display: flex; flex-direction: column; gap: 6px; }
  .dev-sub .cap { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-size: 10px; line-height: 12px; color: var(--gray); }
  .dev-sub .cap .t { font-weight: 600; }
  .dev-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6px; row-gap: 4px; }
  .dev-srv { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; background: rgba(255, 255, 255, .07); }
  .dev-srv .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .dev-srv .lb { font-size: 12px; line-height: 15px; font-weight: 600; color: #fff; white-space: nowrap; }
  .dev-srv .sp { flex: 1; min-width: 6px; }
  .dev-srv .pt { font-size: 11px; line-height: 13px; color: var(--gray); font-variant-numeric: tabular-nums; }
  .dev-srv .pt.ok { color: var(--green); }
  .dev-srv .ac { color: var(--gray); display: flex; }
  .dev-notes { display: flex; flex-direction: column; gap: 4px; }
  .dev-note { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border-radius: 9px; background: rgba(255, 255, 255, .06); }
  .dev-note .ic { flex: none; padding-top: 1px; display: flex; }
  .dev-note .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .dev-note .ti { font-size: 12px; line-height: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-note .ms { font-size: 11px; line-height: 13px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-note .ag { font-size: 11px; line-height: 13px; color: var(--gray); font-variant-numeric: tabular-nums; padding-left: 6px; }
  .pane { position: relative; width: 1400px; overflow: hidden; --W: 1400px; --s: 2; }
</style>
</head>
<body>
<div class="scene" data-size="1400x1026" style="--W:1400px;--H:1026px;display:flex;flex-direction:column;gap:16px;background:#151827">
  <div class="pane" style="--H:494px;height:494px">
  <div class="desk"></div>
  <div class="stage">
    <div class="notch open" style="--nw:640px;--nh:219px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
              <div class="tab sel"><i data-icon="terminal" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Mon 2</div>
            <div class="round-btn"><i data-icon="camera" data-size="16"></i></div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct">
              <span class="pct">64%</span>
              <div class="battery">
                <svg width="31" height="15" viewBox="0 0 31 15">
                  <rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/>
                  <path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/>
                  <rect x="2" y="2.9" width="15.4" height="9.25" rx="2.5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="nx-content" style="height:auto">
          <div class="dev-tab">
            <div class="dev-seg"><span class="s">GitHub</span><span class="s sel">Servers</span><span class="s">Notifications</span></div>
            <div class="dev-sub"><div class="cap"><span class="t">Dev servers</span></div><div class="dev-grid" id="grid"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div class="pane" style="--H:516px;height:516px">
  <div class="desk"></div>
  <div class="stage">
    <div class="notch open" style="--nw:640px;--nh:230px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
              <div class="tab sel"><i data-icon="terminal" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Mon 2</div>
            <div class="round-btn"><i data-icon="camera" data-size="16"></i></div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct">
              <span class="pct">64%</span>
              <div class="battery">
                <svg width="31" height="15" viewBox="0 0 31 15">
                  <rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/>
                  <path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/>
                  <rect x="2" y="2.9" width="15.4" height="9.25" rx="2.5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="nx-content" style="height:auto">
          <div class="dev-tab">
            <div class="dev-seg"><span class="s">GitHub</span><span class="s">Servers</span><span class="s sel">Notifications</span></div>
            <div class="dev-sub"><div class="cap"><span class="t">Notifications</span><span>Clear</span></div><div class="dev-notes" id="notes"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>

<script src="icons.js"></script>
<script>
  var ARROW = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M8 6h10v10"/></svg>';
  var COPY = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2.6"/><path d="M15.5 5.5v-.9a2.1 2.1 0 0 0-2.1-2.1H4.6a2.1 2.1 0 0 0-2.1 2.1v8.8a2.1 2.1 0 0 0 2.1 2.1h.9"/></svg>';
  var servers = [
    [3000, 'Node / Next', 0], [3001, 'Dev server', 0], [5173, 'Vite', 0], [5432, 'Postgres', 1],
    [6379, 'Redis', 1], [8000, 'Django / Python', 0], [8080, 'HTTP alt', 0], [27017, 'MongoDB', 1]
  ];
  document.getElementById('grid').innerHTML = servers.map(function (s) {
    var copied = s[0] === 5432;
    return '<div class="dev-srv"><span class="dot"></span><span class="lb">' + s[1] + '</span><span class="sp"></span>' +
      '<span class="pt' + (copied ? ' ok' : '') + '">' + (copied ? 'Copied' : ':' + s[0]) + '</span><span class="ac">' + (s[2] ? COPY : ARROW) + '</span></div>';
  }).join('');
  var BLUE = 'rgb(89,166,255)';
  var notes = [
    ['checkCircle', 'var(--green)', 'Tests passed', 'web-app: 482 passed, 0 failed in 38s', '2m'],
    ['info', BLUE, 'Deploy finished', 'api-server v2.4.1 is live on staging', '14m'],
    ['xCircle', 'var(--red)', 'Build failed', 'mobile-ios: 2 errors in CartView.swift', '1h']
  ];
  document.getElementById('notes').innerHTML = notes.map(function (n) {
    return '<div class="dev-note"><span class="ic" style="color:' + n[1] + '">' + Nubrix.icon(n[0], 13) + '</span><div class="tx"><div class="ti">' + n[2] +
      '</div><div class="ms">' + n[3] + '</div></div><span class="ag">' + n[4] + '</span></div>';
  }).join('');
</script>
</body>
</html>
