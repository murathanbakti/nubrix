<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nubrix shelf mockup</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* ShelfView: HStack(spacing 12) { FileShareView (square), panel (dashed RoundedRectangle r16, padding 16) } */
  .sh-row { display: flex; gap: 12px; height: 138px; }
  .sh-share { width: 138px; height: 138px; position: relative; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  .sh-share .dash, .sh-panel .dash { position: absolute; inset: 0; }
  .sh-share .circle { width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 255, 255, .09); display: flex; align-items: center; justify-content: center; color: var(--gray); }
  .sh-share .label { font-family: var(--rounded); font-size: 13px; font-weight: 700; line-height: 16px; color: rgba(255, 255, 255, .8); }
  .sh-panel { position: relative; flex: 1; height: 138px; }
  .sh-items { position: absolute; left: 8px; top: 8px; display: flex; gap: 8px; }
  .sh-item { width: 115px; padding: 10px 5px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sh-item.sel { background: rgba(10, 132, 255, .15); box-shadow: inset 0 0 0 2px rgba(10, 132, 255, .8); }
  .sh-item .ico { width: 56px; height: 56px; position: relative; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .15)); }
  .sh-item .ico svg { width: 56px; height: 56px; }
  .sh-item .nm { width: 105px; height: 30px; text-align: center; font-size: 12px; font-weight: 500; line-height: 15px; color: #fff; white-space: nowrap; }
</style>
</head>
<body>
<!-- Open notch, Shelf tab (tray selected): quick-share drop zone + shelf items. Dummy files only. -->
<div class="scene" data-size="1400x404" style="--W:1400px;--H:404px;--s:1.9">
  <div class="desk"></div>
  <div class="stage">
    <div class="notch open" style="--nw:720px;--nh:190px">
      <div class="notch-body">
        <div class="nx-header">
          <div class="nx-left">
            <div class="tabs">
              <div class="tab"><i data-icon="house" data-size="15"></i></div>
              <div class="tab sel"><i data-icon="tray" data-size="15"></i></div>
              <div class="tab"><i data-icon="stack" data-size="15"></i></div>
              <div class="tab"><i data-icon="sparkle" data-size="15"></i></div>
              <div class="tab"><i data-icon="terminal" data-size="15"></i></div>
            </div>
          </div>
          <div class="nx-gap"></div>
          <div class="nx-right">
            <div class="date-pill">Mon 2</div>
            <div class="round-btn"><i data-icon="camera" data-size="16"></i></div>
            <div class="round-btn"><i data-icon="gear" data-size="16"></i></div>
            <div class="battery-pct">
              <span class="pct">64%</span>
              <div class="battery">
                <svg width="31" height="15" viewBox="0 0 31 15">
                  <rect x=".5" y=".5" width="27" height="14" rx="4.2" fill="none" stroke="#fff" stroke-opacity=".5"/>
                  <path d="M29 5v5c1-.3 1.7-1.2 1.7-2.5S30 5.3 29 5z" fill="#fff" fill-opacity=".5"/>
                  <rect x="2" y="2.9" width="15.4" height="9.25" rx="2.5" fill="#fff"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="nx-content">
          <div class="sh-row">
            <div class="sh-share">
              <svg class="dash" width="138" height="138" viewBox="0 0 138 138"><rect x="0" y="0" width="138" height="138" rx="12" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/></svg>
              <div class="circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.4M7.6 7.6 12 3.2l4.4 4.4M8 10.2H6.6A2.2 2.2 0 0 0 4.4 12.4v6.4A2.2 2.2 0 0 0 6.6 21h10.8a2.2 2.2 0 0 0 2.2-2.2v-6.4a2.2 2.2 0 0 0-2.2-2.2H16"/></svg>
              </div>
              <div class="label">AirDrop</div>
            </div>

            <div class="sh-panel">
              <svg class="dash" width="508" height="138" viewBox="0 0 508 138"><rect x="0" y="0" width="508" height="138" rx="16" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/></svg>
              <div class="sh-items">
                <!-- PDF -->
                <div class="sh-item">
                  <div class="ico"><svg viewBox="0 0 56 56">
                    <rect x="7" y="0.5" width="42" height="55" rx="3" fill="#f7f7f9"/><rect x="7" y="0.5" width="42" height="55" rx="3" fill="none" stroke="rgba(0,0,0,.14)"/>
                    <rect x="12" y="7" width="20" height="3.2" rx="1.2" fill="#2b2f3a"/>
                    <rect x="12" y="12.6" width="13" height="2" rx="1" fill="#9aa0ad"/>
                    <rect x="12" y="20" width="32" height="17" rx="2" fill="#e8ebf5"/>
                    <rect x="15" y="29" width="4" height="6" rx=".8" fill="#6a7bff"/><rect x="21" y="25" width="4" height="10" rx=".8" fill="#6a7bff"/><rect x="27" y="27.5" width="4" height="7.5" rx=".8" fill="#a24bd8"/><rect x="33" y="23" width="4" height="12" rx=".8" fill="#e0407c"/><rect x="39" y="26" width="3" height="9" rx=".8" fill="#ff9a52"/>
                    <rect x="12" y="41" width="32" height="1.8" rx=".9" fill="#c4c8d2"/><rect x="12" y="45" width="32" height="1.8" rx=".9" fill="#c4c8d2"/><rect x="12" y="49" width="20" height="1.8" rx=".9" fill="#c4c8d2"/>
                  </svg></div>
                  <div class="nm">design-review.pdf</div>
                </div>
                <!-- PNG (selected) -->
                <div class="sh-item sel">
                  <div class="ico"><svg viewBox="0 0 56 56">
                    <defs>
                      <linearGradient id="s_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150a3a"/><stop offset=".45" stop-color="#5a1c86"/><stop offset=".72" stop-color="#e0407c"/><stop offset="1" stop-color="#ff9a52"/></linearGradient>
                      <linearGradient id="s_sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient>
                      <clipPath id="s_clip"><rect x="0" y="10.5" width="56" height="35" rx="3"/></clipPath>
                    </defs>
                    <g clip-path="url(#s_clip)">
                      <svg x="0" y="10.5" width="56" height="35" viewBox="0 20 128 80" preserveAspectRatio="xMidYMid slice">
                        <rect width="128" height="128" fill="url(#s_sky)"/>
                        <g fill="#fff" opacity=".8"><circle cx="18" cy="26" r="1"/><circle cx="44" cy="22" r=".8"/><circle cx="96" cy="26" r="1"/><circle cx="112" cy="40" r=".8"/></g>
                        <circle cx="64" cy="76" r="30" fill="url(#s_sun)"/>
                        <path d="M0 96 L24 84 L44 94 L70 80 L98 94 L128 86 V128 H0Z" fill="#1b0f33"/>
                        <path d="M0 108 L128 100 V128 H0Z" fill="#0d0620"/>
                      </svg>
                    </g>
                    <rect x=".5" y="11" width="55" height="34" rx="3" fill="none" stroke="rgba(255,255,255,.18)"/>
                  </svg></div>
                  <div class="nm">hero@2x.png</div>
                </div>
                <!-- MD -->
                <div class="sh-item">
                  <div class="ico"><svg viewBox="0 0 56 56">
                    <path d="M10 3.5C10 2 11 1 12.5 1H37l10 10v41.5c0 1.5-1 2.5-2.5 2.5h-32C11 55 10 54 10 52.5z" fill="#f2f2f4"/>
                    <path d="M37 1v7.5c0 1.4 1.1 2.5 2.5 2.5H47z" fill="#c9c9d0"/>
                    <rect x="14.5" y="15" width="16" height="3.4" rx="1.2" fill="#2b2f3a"/>
                    <rect x="14.5" y="22" width="27" height="1.9" rx=".95" fill="#a4a8b3"/><rect x="14.5" y="26.2" width="23" height="1.9" rx=".95" fill="#a4a8b3"/>
                    <rect x="14.5" y="30.4" width="27" height="1.9" rx=".95" fill="#a4a8b3"/>
                    <rect x="14.5" y="36" width="3" height="1.9" rx=".95" fill="#6a7bff"/><rect x="19.5" y="36" width="19" height="1.9" rx=".95" fill="#a4a8b3"/>
                    <rect x="14.5" y="40.2" width="3" height="1.9" rx=".95" fill="#6a7bff"/><rect x="19.5" y="40.2" width="15" height="1.9" rx=".95" fill="#a4a8b3"/>
                    <text x="14.5" y="50.6" font-family="-apple-system, sans-serif" font-size="6.2" font-weight="700" fill="#6e6e78">MD</text>
                  </svg></div>
                  <div class="nm">release-notes.md</div>
                </div>
                <!-- ZIP -->
                <div class="sh-item">
                  <div class="ico"><svg viewBox="0 0 56 56">
                    <path d="M10 3.5C10 2 11 1 12.5 1H37l10 10v41.5c0 1.5-1 2.5-2.5 2.5h-32C11 55 10 54 10 52.5z" fill="#ece8df"/>
                    <path d="M37 1v7.5c0 1.4 1.1 2.5 2.5 2.5H47z" fill="#c8c2b4"/>
                    <g fill="#5f5a50"><rect x="25" y="2.5" width="3" height="3"/><rect x="28" y="5.5" width="3" height="3"/><rect x="25" y="8.5" width="3" height="3"/><rect x="28" y="11.5" width="3" height="3"/><rect x="25" y="14.5" width="3" height="3"/><rect x="28" y="17.5" width="3" height="3"/><rect x="25" y="20.5" width="3" height="3"/><rect x="28" y="23.5" width="3" height="3"/></g>
                    <rect x="24.2" y="27" width="7.6" height="10.5" rx="2" fill="#8a8476"/><rect x="26.6" y="31" width="2.8" height="4.4" rx="1.2" fill="#ece8df"/>
                    <text x="14.5" y="50.6" font-family="-apple-system, sans-serif" font-size="6.2" font-weight="700" fill="#6e6a60">ZIP</text>
                  </svg></div>
                  <div class="nm">build-2.4.zip</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
</body>
</html>
